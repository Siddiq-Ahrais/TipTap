<!-- ATTENDANCE HISTORY ROUTE -->
<template x-if="route.name === 'attendanceHistory' && currentUser">
    <div class="space-y-6">
        <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <h3 class="font-display text-lg font-semibold text-navy-primary">Your Full Attendance Record</h3>
                    <p class="text-sm text-slate-500">Complete history of your clock-in and clock-out activity.</p>
                </div>

                <div class="flex items-center gap-2">
                    <label for="att_per_page" class="text-xs font-semibold uppercase tracking-[0.12em] text-slate-500">Show</label>
                    <select id="att_per_page" x-model.number="attendancePagination.perPage" @change="attendancePagination.page = 1"
                        class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-700 focus:border-[#0B4A85] focus:ring-2 focus:ring-[#0B4A85] outline-none cursor-pointer">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    <span class="text-xs font-semibold uppercase tracking-[0.12em] text-slate-500">entries</span>
                </div>
            </div>
        </section>

        <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <header class="bg-[#0B4A85] text-white">
                <div class="flex flex-col gap-1 p-4 sm:flex-row sm:items-center sm:justify-between">
                    <div>
                        <h3 class="font-display text-lg font-semibold">Attendance Log</h3>
                        <p class="text-sm text-white/85">Sorted by most recent first</p>
                    </div>
                    <span class="rounded-full bg-white/20 px-3 py-1 text-xs font-semibold text-white"
                        x-text="attendanceHistoryData().total + (attendanceHistoryData().total === 1 ? ' record total' : ' records total')"></span>
                </div>
            </header>

            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-slate-50 text-slate-600">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-[0.14em]">#</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-[0.14em]">Date</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-[0.14em]">Clock In</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-[0.14em]">Clock Out</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-[0.14em]">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="(att, idx) in attendanceHistoryData().items" :key="att.id">
                            <tr class="hover:bg-slate-50/80 transition-colors">
                                <td class="px-4 py-3 font-semibold text-slate-400" x-text="attendanceHistoryData().startIndex + idx + 1"></td>
                                <td class="px-4 py-3 font-medium text-slate-700" x-text="formatWeekdayDate(att.tanggal)"></td>
                                <td class="px-4 py-3 text-slate-600 font-mono text-xs" x-text="att.waktu_masuk || '-'"></td>
                                <td class="px-4 py-3 text-slate-600 font-mono text-xs" x-text="att.waktu_keluar || '—'"></td>
                                <td class="px-4 py-3">
                                    <span class="inline-flex items-center gap-2 rounded-full border px-3 py-1 text-xs font-semibold uppercase tracking-[0.12em]"
                                        :class="statusPillBadgeClass(resolveAttendanceBadge(att).tone)">
                                        <span class="h-2 w-2 rounded-full" :class="statusPillDotClass(resolveAttendanceBadge(att).tone)"></span>
                                        <span x-text="resolveAttendanceBadge(att).label"></span>
                                    </span>
                                </td>
                            </tr>
                        </template>
                        <template x-if="attendanceHistoryData().items.length === 0">
                            <tr>
                                <td colspan="5" class="px-4 py-10 text-center text-sm text-slate-500">No attendance records found.</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <template x-if="attendanceHistoryData().totalPages > 1">
                <div class="border-t border-slate-200 bg-slate-50/80 px-4 py-3 flex flex-col items-center gap-3 sm:flex-row sm:justify-between">
                    <p class="text-xs text-slate-500">
                        Showing <span class="font-semibold text-slate-700" x-text="attendanceHistoryData().startIndex + 1"></span>
                        to <span class="font-semibold text-slate-700" x-text="attendanceHistoryData().endIndex"></span>
                        of <span class="font-semibold text-slate-700" x-text="attendanceHistoryData().total"></span> records
                    </p>
                    <nav class="flex items-center gap-1">
                        <button type="button" :disabled="attendancePagination.page <= 1" @click="attendancePagination.page--"
                            class="inline-flex h-8 px-2.5 items-center justify-center rounded-lg border border-slate-200 bg-white text-xs font-medium text-slate-600 disabled:opacity-40 hover:bg-[#0B4A85] hover:text-white">
                            Prev
                        </button>
                        <template x-for="p in attendanceHistoryData().totalPages" :key="p">
                            <button type="button" @click="attendancePagination.page = p"
                                class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-xs font-semibold transition-colors"
                                :class="attendancePagination.page === p ? 'bg-[#0B4A85] text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-[#0B4A85] hover:text-white'"
                                x-text="p"></button>
                        </template>
                        <button type="button" :disabled="attendancePagination.page >= attendanceHistoryData().totalPages" @click="attendancePagination.page++"
                            class="inline-flex h-8 px-2.5 items-center justify-center rounded-lg border border-slate-200 bg-white text-xs font-medium text-slate-600 disabled:opacity-40 hover:bg-[#0B4A85] hover:text-white">
                            Next
                        </button>
                    </nav>
                </div>
            </template>
        </section>
    </div>
</template>
