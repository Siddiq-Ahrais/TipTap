<!-- PROFILE EDIT -->
<template x-if="route.name === 'profile' && currentUser">
    <div class="space-y-6">
        <div class="p-4 sm:p-8 bg-white shadow rounded-xl border border-[#0B4A85]/15">
            <div class="max-w-xl">
                <section>
                    <header>
                        <h2 class="text-lg font-medium text-gray-900">Profile Information</h2>
                        <p class="mt-1 text-sm text-gray-600">Update your account's profile information and email address.</p>
                    </header>

                    <form @submit.prevent="submitProfileUpdate()" class="mt-6 space-y-6">
                        <div>
                            <label for="prof_name" class="block font-medium text-sm text-gray-700">Name</label>
                            <input id="prof_name" type="text" x-model="profileForm.name" required
                                class="mt-1 block w-full border-gray-300 focus:border-[#0B4A85] focus:ring-[#0B4A85] rounded-md shadow-sm" />
                        </div>

                        <div>
                            <label for="prof_email" class="block font-medium text-sm text-gray-700">Email</label>
                            <input id="prof_email" type="email" x-model="profileForm.email" required
                                class="mt-1 block w-full border-gray-300 focus:border-[#0B4A85] focus:ring-[#0B4A85] rounded-md shadow-sm" />
                        </div>

                        <div class="flex flex-wrap items-center gap-3">
                            <button type="submit"
                                class="inline-flex items-center justify-center rounded-lg border border-[#0B4A85] bg-[#0B4A85] px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-[#063157]">
                                Save
                            </button>
                            <button type="button" @click="syncFormsFromState()"
                                class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
                                Cancel
                            </button>
                            <span x-cloak x-show="profileForm.saved" class="text-sm text-emerald-600 font-medium">Saved.</span>
                        </div>
                    </form>
                </section>
            </div>
        </div>

        <div class="p-4 sm:p-8 bg-white shadow rounded-xl border border-[#0B4A85]/15">
            <div class="max-w-xl">
                <section>
                    <header>
                        <h2 class="text-lg font-medium text-gray-900">Update Password</h2>
                        <p class="mt-1 text-sm text-gray-600">Ensure your account is using a long, random password to stay secure.</p>
                    </header>

                    <form @submit.prevent="submitPasswordUpdate()" class="mt-6 space-y-6">
                        <div>
                            <label for="prof_curr_pw" class="block font-medium text-sm text-gray-700">Current Password</label>
                            <input id="prof_curr_pw" type="password" x-model="passwordForm.current_password" required
                                class="mt-1 block w-full border-gray-300 focus:border-[#0B4A85] focus:ring-[#0B4A85] rounded-md shadow-sm" />
                        </div>
                        <div>
                            <label for="prof_new_pw" class="block font-medium text-sm text-gray-700">New Password</label>
                            <input id="prof_new_pw" type="password" x-model="passwordForm.password" required
                                class="mt-1 block w-full border-gray-300 focus:border-[#0B4A85] focus:ring-[#0B4A85] rounded-md shadow-sm" />
                        </div>
                        <div>
                            <label for="prof_conf_pw" class="block font-medium text-sm text-gray-700">Confirm Password</label>
                            <input id="prof_conf_pw" type="password" x-model="passwordForm.password_confirmation" required
                                class="mt-1 block w-full border-gray-300 focus:border-[#0B4A85] focus:ring-[#0B4A85] rounded-md shadow-sm" />
                        </div>

                        <p x-cloak x-show="passwordForm.error" x-text="passwordForm.error" class="text-xs text-rose-600"></p>

                        <div class="flex flex-wrap items-center gap-3">
                            <button type="submit"
                                class="inline-flex items-center justify-center rounded-lg border border-[#0B4A85] bg-[#0B4A85] px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-[#063157]">
                                Save
                            </button>
                            <span x-cloak x-show="passwordForm.saved" class="text-sm text-emerald-600 font-medium">Saved.</span>
                        </div>
                    </form>
                </section>
            </div>
        </div>

        <div class="p-4 sm:p-8 bg-white shadow rounded-xl border border-[#0B4A85]/15" x-data="{ confirmDelete: false }">
            <div class="max-w-xl space-y-6">
                <header>
                    <h2 class="text-lg font-medium text-gray-900">Delete Account</h2>
                    <p class="mt-1 text-sm text-gray-600">
                        Once your account is deleted, all of its resources and data will be permanently deleted.
                    </p>
                </header>

                <button type="button" @click="confirmDelete = true"
                    class="inline-flex items-center px-4 py-2 bg-red-600 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-red-500">
                    Delete Account
                </button>

                <div x-cloak x-show="confirmDelete" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
                    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl" @click.away="confirmDelete = false">
                        <h3 class="text-lg font-medium text-gray-900">Are you sure you want to delete your account?</h3>
                        <p class="mt-1 text-sm text-gray-600">Please enter your password to confirm deletion.</p>
                        <form @submit.prevent="submitDeleteAccount(() => confirmDelete = false)" class="mt-4 space-y-4">
                            <input type="password" x-model="deleteAccountForm.password" placeholder="Password" required
                                class="block w-full border-gray-300 focus:border-[#0B4A85] focus:ring-[#0B4A85] rounded-md shadow-sm" />
                            <p x-cloak x-show="deleteAccountForm.error" x-text="deleteAccountForm.error" class="text-xs text-rose-600"></p>
                            <div class="flex justify-end gap-2">
                                <button type="button" @click="confirmDelete = false"
                                    class="inline-flex items-center px-4 py-2 bg-white border border-gray-300 rounded-md font-semibold text-xs text-gray-700 uppercase tracking-widest hover:bg-gray-50">
                                    Cancel
                                </button>
                                <button type="submit"
                                    class="inline-flex items-center px-4 py-2 bg-red-600 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-red-500">
                                    Delete Account
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
